<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eaglercraft Versions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@700&family=VT323&display=swap" rel="stylesheet">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<style>
  :root {
    --night: #15120d;
    --ink: #efe9d6;
    --muted: #b9b29d;
    --grass: #6fae3e;
    --grass-dark: #3f6b22;
    --dirt: #6b4a2b;
    --stone: #4a4945;
    --stone-hover: #5b5a54;
    --hi: #8f8e88;
    --lo: #1c1b19;
    --gold: #f0c04a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { image-rendering: pixelated; }
  body {
    font-family: "VT323", ui-monospace, "Courier New", monospace;
    font-size: 20px;
    color: var(--ink);
    background: var(--night) url("https://picsum.photos/seed/eaglercraft/160/90") top left / cover fixed no-repeat;
    image-rendering: pixelated;
    min-height: 100vh;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(21, 18, 13, 0.88);
    pointer-events: none;
  }
  .grass {
    position: relative;
    height: 14px;
    background: var(--grass);
    border-bottom: 6px solid var(--dirt);
    box-shadow: inset 0 -4px 0 var(--grass-dark);
  }
  .wrap {
    position: relative;
    max-width: 680px;
    padding: 36px 20px 56px 8vw;
  }
  h1 {
    font-family: "Silkscreen", "VT323", monospace;
    font-size: 30px;
    line-height: 1.1;
    letter-spacing: 1px;
    text-shadow: 3px 3px 0 var(--lo);
  }
  h1 .tag { color: var(--grass); }
  h1 .cursor { color: var(--gold); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .lead { margin-top: 10px; color: var(--muted); font-size: 22px; line-height: 1.25; }

  .rows { margin-top: 26px; display: flex; flex-direction: column; gap: 12px; }
  a.row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    color: var(--ink);
    text-decoration: none;
    background: var(--stone);
    border: 3px solid;
    border-color: var(--hi) var(--lo) var(--lo) var(--hi);
  }
  a.row:hover { background: var(--stone-hover); }
  a.row:hover .name { color: var(--gold); }
  a.row:active { border-color: var(--lo) var(--hi) var(--hi) var(--lo); }
  a.row:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .badge {
    position: absolute;
    top: -9px;
    right: 10px;
    padding: 2px 6px;
    font-family: "Silkscreen", "VT323", monospace;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--night);
    background: var(--gold);
    border: 3px solid;
    border-color: #ffe08a #9a7414 #9a7414 #ffe08a;
  }
  .slot {
    flex: none;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #2a2926;
    border: 3px solid;
    border-color: var(--lo) var(--hi) var(--hi) var(--lo);
  }
  .slot iconify-icon { font-size: 24px; color: var(--grass); }
  .meta { flex: 1; min-width: 0; }
  .name {
    display: block;
    font-family: "Silkscreen", "VT323", monospace;
    font-size: 14px;
    word-break: break-all;
    text-shadow: 2px 2px 0 var(--lo);
  }
  .desc { display: block; margin-top: 3px; font-size: 20px; line-height: 1.15; color: var(--muted); }
  .side { flex: none; display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .size { font-size: 18px; }
  .side iconify-icon { font-size: 18px; }

  footer { margin-top: 20px; color: var(--muted); font-size: 18px; }
  .err { display: none; margin-top: 22px; padding: 8px 12px; background: #3a1f1a; border: 3px solid #8c3a2c; color: #f0a090; }
</style>
</head>
<body>
<div class="grass"></div>
<div class="wrap">
  <header>
    <h1>Eaglercraft <span class="tag">Versions</span><span class="cursor">_</span></h1>
    <p class="lead">Unblocked Minecraft in your browser!<br>Credits to Eaglercraft, Claude Code</p>
  </header>
  <div class="rows" id="rows"></div>
  <div class="err" id="err">The list broke. Refresh and try again.</div>
  <footer>Click a file to start Minecrafting</footer>
</div>
<script>
  const REPO = "Mzeoi/Eaglercraft_1.16.5-26.2";

  const FILTER = {
    hide: ["index.html", "1.19.4_parts", "horizon-web-26.3"],
    hidePatterns: [/^\./, /^_/],
    showOnly: null,
    allowExt: [".html"],
    showDirs: true,
  };

  const DESC = {
    "26.2.html": "Performance may suffer (A LOT!)",
    "1.20.6.html": "May lag in singleplayer, multiplayer is recommended",
    "1.16.5.html": "Optimized, works fine on low end PCs",
    "1.19.4.html": "Caves & Cliffs full updated, multiplayer is recommended",
    "26.3_horizon.html": "Fabulously optimized by nobuildersnotools team, straight 60 FPS on a chromebook",
    "launch_about_blank.html": "Loads in about:blank. Bypass url filters like Dyknow",
    "resource_packs": "Fun working resource packs",
  };

  // Files that get the gold "Recommended" tag (names must match exactly)
  const RECOMMENDED = ["26.3_horizon.html"];

  function isVisible(item) {
    if (FILTER.showOnly) return FILTER.showOnly.includes(item.name);
    if (FILTER.hide.includes(item.name)) return false;
    if (FILTER.hidePatterns.some((re) => re.test(item.name))) return false;
    if (item.type === "dir") return FILTER.showDirs;
    return FILTER.allowExt.some((ext) => item.name.toLowerCase().endsWith(ext));
  }

  function fmtSize(n) {
    if (!n) return "";
    if (n >= 1048576) return (n / 1048576).toFixed(1) + " MB";
    if (n >= 1024) return (n / 1024).toFixed(1) + " KB";
    return n + " B";
  }
  function iconFor(item) {
    if (item.type === "dir") return "pixelarticons:folder";
    if (item.name.endsWith(".html")) return "mdi:minecraft";
    return "pixelarticons:file";
  }
  function hrefFor(item) {
    return "/" + item.path.split("/").map(encodeURIComponent).join("/") + (item.type === "dir" ? "/" : "");
  }

  async function load() {
    let data = null;
    try {
      const r = await fetch("/__api/list", { cache: "no-store" });
      if (r.ok) data = await r.json();
    } catch (e) {}
    if (!data) {
      const r = await fetch("https://api.github.com/repos/" + REPO + "/contents/?ref=main", {
        headers: { "Accept": "application/vnd.github.v3+json", "User-Agent": "eagler-site" },
      });
      if (!r.ok) throw new Error("http " + r.status);
      const arr = await r.json();
      data = { items: arr.map((d) => ({ name: d.name, path: d.path, type: d.type, size: d.size })) };
    }
    const items = (data.items || []).filter(isVisible);
    const files = items.filter((i) => i.type === "file").sort((a, b) => b.name.localeCompare(a.name));
    const dirs = items.filter((i) => i.type === "dir").sort((a, b) => a.name.localeCompare(b.name));
    render(files.concat(dirs));
  }

  function render(items) {
    const box = document.getElementById("rows");
    for (const item of items) {
      const a = document.createElement("a");
      a.className = "row";
      a.href = hrefFor(item);

      const slot = document.createElement("span");
      slot.className = "slot";
      const icon = document.createElement("iconify-icon");
      icon.setAttribute("icon", iconFor(item));
      slot.append(icon);

      const meta = document.createElement("span");
      meta.className = "meta";
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = item.name;
      meta.append(name);
      if (DESC[item.name]) {
        const desc = document.createElement("span");
        desc.className = "desc";
        desc.textContent = DESC[item.name];
        meta.append(desc);
      }

      const side = document.createElement("span");
      side.className = "side";
      const size = document.createElement("span");
      size.className = "size";
      size.textContent = fmtSize(item.size);
      const arrowIcon = document.createElement("iconify-icon");
      arrowIcon.setAttribute("icon", "pixelarticons:arrow-right");
      side.append(size, arrowIcon);

      a.append(slot, meta, side);

      if (RECOMMENDED.includes(item.name)) {
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = "Recommended";
        a.append(badge);
      }

      box.append(a);
    }
  }

  load().catch(() => { document.getElementById("err").style.display = "block"; });
</script>

</body>
</html>
