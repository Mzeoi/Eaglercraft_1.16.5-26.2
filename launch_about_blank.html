<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launcher</title>
</head>
<body>
<div id="list">Loading...</div>

<script>
  const REPO = 'Mzeoi/Eaglercraft_1.16.5-26.2';
  const BRANCH = 'main';
  const DIR_URL = './';

  // Backup list, used only if the GitHub API fails. Add new files here.
  const FILES = ['26.2.html', '1.20.6.html', '1.16.5.html'];

  // Custom loading: when a file name matches a key, load that url instead.
  //   url:   the page to load (relative paths are resolved against this launcher)
  //   mode:  'cloak'  = about:blank window + iframe (the old behavior, default)
  //          'direct' = open the url as a normal tab (needed for games that
  //                     require cross-origin isolation / SharedArrayBuffer)
  //   label: optional text for the button
  // The key does NOT have to be a real file; it shows up in the list anyway.
  const CUSTOM = {
    '26.3_horizon.html': {
      url: './horizon-web-26.3/index.html',
      mode: 'cloak',
      label: 'Launch 26.3_horizon.html'
    }
    // '1.21.html': { url: './some-folder/index.html' },            // cloak mode
    // 'other.html': { url: 'https://example.com/game/', mode: 'direct' },
  };

  const REDIRECT_URL = 'https://www.google.com';
  const FAKE_TITLE = 'Google';

  const self = decodeURIComponent(location.pathname.split('/').pop());
  const HIDDEN = [self, 'index.html'];

  function keep(name) {
    return /\.html?$/i.test(name) && HIDDEN.indexOf(name) === -1;
  }

  // 1) Parse a directory index (works on servers that list files).
  async function listFromIndex() {
    const base = new URL(DIR_URL, location.href);
    const res = await fetch(base.href);
    if (!res.ok) throw new Error('no index');
    const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
    const out = [];
    doc.querySelectorAll('a[href]').forEach(function (a) {
      const u = new URL(a.getAttribute('href'), base);
      const name = decodeURIComponent(u.pathname.split('/').pop());
      if (u.origin === base.origin && keep(name)) {
        out.push({ name: name, url: u.href });
      }
    });
    return out;
  }

  // 2) Ask the GitHub API (works on GitHub Pages, rate limited).
  async function listFromGitHub() {
    const api = 'https://api.github.com/repos/' + REPO + '/contents/?ref=' + BRANCH;
    const res = await fetch(api, { headers: { Accept: 'application/vnd.github.v3+json' } });
    if (!res.ok) throw new Error('api ' + res.status);
    const arr = await res.json();
    return arr
      .filter(function (d) { return d.type === 'file' && keep(d.name); })
      .map(function (d) {
        return { name: d.name, url: new URL(encodeURIComponent(d.name), location.href).href };
      });
  }

  // 3) Fall back to the list written in this file.
  async function listFromInline() {
    return FILES.filter(keep).map(function (n) {
      return { name: n, url: new URL(encodeURIComponent(n), location.href).href };
    });
  }

  // Apply CUSTOM: override urls of matching files, and add virtual entries.
  function applyCustom(files) {
    const byName = {};
    files.forEach(function (f) { byName[f.name] = f; });

    Object.keys(CUSTOM).forEach(function (name) {
      const c = CUSTOM[name];
      const entry = byName[name] || { name: name };
      entry.url = new URL(c.url, location.href).href;
      entry.mode = c.mode || 'cloak';
      entry.label = c.label || ('Launch_' + name);
      byName[name] = entry;
    });

    return Object.keys(byName).map(function (n) {
      const f = byName[n];
      f.mode = f.mode || 'cloak';
      f.label = f.label || ('Launch_' + f.name);
      return f;
    });
  }

  function cleanupAndLeave() {
    window.close();
    setTimeout(function () {
      window.location.replace(REDIRECT_URL);
    }, 300);
  }

  // Normal tab, no wrapper. Keeps the page's own headers/isolation intact.
  function launchDirect(url) {
    const w = window.open(url, '_blank');
    if (!w) return;
    cleanupAndLeave();
  }

  // about:blank + iframe, with a fake title and icon.
  function launchCloak(url) {
    const w = window.open('about:blank', '_blank');
    if (!w) return;

    w.document.title = FAKE_TITLE;

    const link = w.document.createElement('link');
    link.rel = 'icon';
    link.href = 'https://www.google.com/favicon.ico';
    w.document.head.appendChild(link);

    const style = w.document.createElement('style');
    style.textContent =
      'html,body{margin:0;height:100%;overflow:hidden;}' +
      'iframe{position:fixed;inset:0;width:100%;height:100%;border:0;}';
    w.document.head.appendChild(style);

    const iframe = w.document.createElement('iframe');
    iframe.src = url;
    iframe.allow = 'fullscreen; autoplay; gamepad; cross-origin-isolated';
    w.document.body.appendChild(iframe);

    cleanupAndLeave();
  }

  function launch(f) {
    if (f.mode === 'direct') launchDirect(f.url);
    else launchCloak(f.url);
  }

  (async function () {
    const box = document.getElementById('list');
    const sources = [listFromIndex, listFromGitHub, listFromInline];
    let files = [];

    for (const source of sources) {
      try {
        files = await source();
      } catch (e) {}
      if (files.length) break;
    }

    files = applyCustom(files);

    box.textContent = '';
    if (!files.length) {
      box.textContent = 'No .html files found.';
      return;
    }

    files.forEach(function (f) {
      const btn = document.createElement('button');
      btn.textContent = f.label;
      btn.addEventListener('click', function () { launch(f); });
      box.appendChild(btn);
      box.appendChild(document.createElement('br'));
    });
  })();
</script>
</body>
</html>
